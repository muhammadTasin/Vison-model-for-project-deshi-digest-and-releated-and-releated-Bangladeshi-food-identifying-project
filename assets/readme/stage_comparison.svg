<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560"
  viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Training-stage benchmark comparison</title>
  <desc id="desc">Horizontal bars compare Stage 1 at 83.16 percent, Stage 2 at 82.11 percent, and Stage 3 at 87.37 percent on 95 images.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", Arial, sans-serif; fill: #172033; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #667085; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 13px; fill: #667085; }
    .value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .mono { font-family: "SFMono-Regular", Consolas, monospace; font-variant-numeric: tabular-nums; }
  </style>
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <text x="70.0" y="62.0" class="title" text-anchor="start" >Training-stage benchmark comparison</text>
<text x="70.0" y="94.0" class="subtitle" text-anchor="start" >Accuracy on the same fixed internal benchmark · n=95 images · 19 classes</text>
<line x1="220.0" y1="132.0" x2="220.0" y2="430.0" stroke="#D9E0EA" stroke-width="1"/>
<text x="220.0" y="455.0" class="small mono" text-anchor="middle" >0%</text>
<line x1="392.0" y1="132.0" x2="392.0" y2="430.0" stroke="#D9E0EA" stroke-width="1"/>
<text x="392.0" y="455.0" class="small mono" text-anchor="middle" >20%</text>
<line x1="564.0" y1="132.0" x2="564.0" y2="430.0" stroke="#D9E0EA" stroke-width="1"/>
<text x="564.0" y="455.0" class="small mono" text-anchor="middle" >40%</text>
<line x1="736.0" y1="132.0" x2="736.0" y2="430.0" stroke="#D9E0EA" stroke-width="1"/>
<text x="736.0" y="455.0" class="small mono" text-anchor="middle" >60%</text>
<line x1="908.0" y1="132.0" x2="908.0" y2="430.0" stroke="#D9E0EA" stroke-width="1"/>
<text x="908.0" y="455.0" class="small mono" text-anchor="middle" >80%</text>
<line x1="1080.0" y1="132.0" x2="1080.0" y2="430.0" stroke="#D9E0EA" stroke-width="1"/>
<text x="1080.0" y="455.0" class="small mono" text-anchor="middle" >100%</text>
<text x="196.0" y="181.0" class="label" text-anchor="end" >Stage 1</text>
<rect x="220.0" y="150.0" width="860.0" height="48.0" fill="#F8FAFC" rx="8"/>
<rect x="220.0" y="150.0" width="715.2" height="48.0" fill="#93C5FD" rx="8"/>
<text x="238.0" y="181.0" class="value mono" text-anchor="start" >79 / 95</text>
<text x="1104.0" y="181.0" class="value mono" text-anchor="start" >83.16%</text>
<text x="196.0" y="281.0" class="label" text-anchor="end" >Stage 2</text>
<rect x="220.0" y="250.0" width="860.0" height="48.0" fill="#F8FAFC" rx="8"/>
<rect x="220.0" y="250.0" width="706.1" height="48.0" fill="#DBEAFE" rx="8"/>
<text x="238.0" y="281.0" class="value mono" text-anchor="start" >78 / 95</text>
<text x="1104.0" y="281.0" class="value mono" text-anchor="start" >82.11%</text>
<text x="196.0" y="381.0" class="label" text-anchor="end" >Stage 3</text>
<rect x="220.0" y="350.0" width="860.0" height="48.0" fill="#F8FAFC" rx="8"/>
<rect x="220.0" y="350.0" width="751.4" height="48.0" fill="#D99A00" rx="8"/>
<text x="238.0" y="381.0" class="value mono" text-anchor="start" >83 / 95</text>
<text x="1104.0" y="381.0" class="value mono" text-anchor="start" >87.37%</text>
<rect x="70.0" y="492.0" width="12.0" height="12.0" fill="#D99A00" rx="2"/>
<text x="92.0" y="503.0" class="small" text-anchor="start" >Stage 3 is +4.21 pp vs Stage 1 and +5.26 pp vs Stage 2</text>
<text x="1130.0" y="503.0" class="small" text-anchor="end" >Source: versioned evaluation reports</text>
</svg>
